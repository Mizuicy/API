<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/darkmode-global.css">
    <script>(function(){var t=localStorage.getItem('kairos-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairos - Painel Admin</title>
    <link rel="stylesheet" href="../../css/livros.css">
    <link rel="stylesheet" href="../../css/admin.css">
    <link rel="stylesheet" href="../../css/notificacoes.css">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">🏛️ Kairos</h1>
                                <nav class="nav">
                    <a href="../../index.html" class="nav-link">Início</a>
                    <a href="../gestao/livros.html" class="nav-link">Adicionar Livro</a>
                    <a href="admin.html" class="nav-link active">Catálogo</a>

                    <div class="nav-dropdown">
                        <button class="nav-link nav-dropdown-btn">Gestão ▾</button>
                        <div class="nav-dropdown-menu">
                            <a href="../gestao/autores.html" class="dropdown-item">✍️ Autores</a>
                            <a href="../gestao/exemplares.html" class="dropdown-item">📦 Exemplares</a>
                            <a href="../gestao/emprestimos.html" class="dropdown-item">🔄 Empréstimos</a>
                        </div>
                    </div>

                    <a href="../perfil.html" class="nav-link nav-link-perfil" title="Perfil">👤</a>
                </nav>
            </div>
        </header>

        <main class="main">
            <section class="catalogo-section">
                <div class="catalogo-header">
                    <h2>Painel de Gestão — Catálogo Completo</h2>
                    <a href="../gestao/livros.html" class="btn-add">+ Adicionar Livro</a>
                </div>

                <!-- Filtros -->
                <div class="filtros">
                    <input type="text" id="searchInput" class="search-input" placeholder="🔍 Pesquisar livros...">
                    <select id="generoFilter" class="filter-select">
                        <option value="">Todos os Gêneros</option>
                        <option value="Ficção">Ficção</option>
                        <option value="Não-Ficção">Não-Ficção</option>
                        <option value="Ficção Científica">Ficção Científica</option>
                        <option value="Fantasia">Fantasia</option>
                        <option value="Romance">Romance</option>
                        <option value="Mistério">Mistério</option>
                        <option value="História">História</option>
                        <option value="Infantil">Infantil</option>
                    </select>
                </div>

                <!-- Grid de Livros -->
                <div id="livrosGrid" class="livros-grid">
                    <div class="loading">Carregando livros...</div>
                </div>
            </section>
        </main>
    </div>

    <!-- Modal para Detalhes do Livro -->
    <div id="modalDetalhes" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="detalhesConteudo" class="detalhes-conteudo"></div>
        </div>
    </div>

    <script src="../../js/admin.js"></script>
    <script src="../../js/nav.js"></script>
    <script src="../../js/kairos-notificacoes-admin.js"></script>
    <style>
        .user-icon-link { text-decoration: none; }
        .user-icon { cursor: pointer; transition: transform 0.18s ease; font-size: 1.5rem; }
        .user-icon:hover { transform: scale(1.15); }
    </style>
<div style="position:fixed;top:16px;right:16px;z-index:9999">
  <button class="theme-toggle" title="Alternar tema">
    <span class="tt-icon tt-sun">☀️</span>
    <span class="tt-track"><span class="tt-ball"></span></span>
    <span class="tt-icon tt-moon">🌙</span>
  </button>
</div>
<script src="../../js/theme.js"></script>
</body>
</html>
