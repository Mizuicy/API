<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="../../css/reset.css">
    <link rel="stylesheet" href="../../css/darkmode-global.css">
    <script>(function(){var t=localStorage.getItem('kairos-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kairos - Login</title>
    <link rel="stylesheet" href="../../css/login.css">
    <style>
        .alert { padding: 12px; border-radius: 6px; margin-bottom: 20px; font-size: 0.95rem; }
        .alert.error   { background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .alert.success { background: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .alert.loading { background: #cfe2ff; color: #084298; border: 1px solid #b6d4fe; }
        .spin {
            display: inline-block; width: 14px; height: 14px;
            border: 2px solid currentColor; border-top-color: transparent;
            border-radius: 50%; animation: spin 0.6s linear infinite; margin-right: 8px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <div class="left-side">
            <h1>🏛️ Kairos</h1>
            <p>Gerenciamento de livros e empréstimos</p>
            <div style="display:flex;flex-direction:column;gap:12px;margin-top:20px;">
                <button class="btn-outline" onclick="location.href='cadastro.html'">Cadastre-se →</button>
            </div>
        </div>

        <div class="right-side">
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('usuario', this)">👤 Usuário</button>
                <button class="tab-btn" onclick="switchTab('admin', this)">🔐 Admin</button>
            </div>

            <!-- Aba Usuário -->
            <div id="usuario" class="tab-content active">
                <div id="usuarioAlert"></div>
                <form id="usuarioForm">
                    <div class="form-group">
                        <label for="usuarioEmail">Email</label>
                        <input type="email" id="usuarioEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="usuarioSenha">Senha</label>
                        <input type="password" id="usuarioSenha" required>
                    </div>
                    <div class="remember-me">
                        <input type="checkbox" id="usuarioLembrar">
                        <label for="usuarioLembrar" style="margin:0;">Lembrar-me</label>
                    </div>
                    <button type="submit" class="btn-submit" id="btnUsuario">Entrar</button>
                </form>
                <div class="forgot-link"><a href="esqueci-senha.html">Esqueci minha senha</a></div>
            </div>

            <!-- Aba Admin -->
            <div id="admin" class="tab-content">
                <div id="adminAlert"></div>
                <form id="adminForm">
                    <div class="form-group">
                        <label for="adminEmail">Email Admin</label>
                        <input type="email" id="adminEmail" required>
                    </div>
                    <div class="form-group">
                        <label for="adminSenha">Senha</label>
                        <input type="password" id="adminSenha" required>
                    </div>
                    <button type="submit" class="btn-submit" id="btnAdmin">Entrar como Admin</button>
                </form>
            </div>
        </div>
    </div>

    <script>
        const API = 'http://localhost:3000';

        (function() {
            const token = sessionStorage.getItem('authToken');
            const tipo = sessionStorage.getItem('tipoUsuario');
            if (token && tipo) {
                // Admin vai direto para o painel; usuário comum para validação de conta
                if (tipo === 'admin') {
                    window.location.href = '../../index.html';
                } else {
                    window.location.href = 'validacoes.html';
                }
            }
        })();

        function switchTab(tabName, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(tabName).classList.add('active');
            btn.classList.add('active');
        }

        function alerta(id, msg, tipo) {
            document.getElementById(id).innerHTML = `<div class="alert ${tipo}">${msg}</div>`;
        }

        // Exibe mensagem de reset de senha, se houver
        const resetSuccess = sessionStorage.getItem('resetSuccessMessage');
        if (resetSuccess) {
            alerta('usuarioAlert', `✅ ${resetSuccess}`, 'success');
            sessionStorage.removeItem('resetSuccessMessage');
        }

        // ── Login de Usuário ──────────────────────────────────────────────
        document.getElementById('usuarioForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('usuarioEmail').value.trim();
            const senha = document.getElementById('usuarioSenha').value;
            const btn   = document.getElementById('btnUsuario');

            btn.disabled = true;
            alerta('usuarioAlert', '<span class="spin"></span>Verificando…', 'loading');

            try {
                const res  = await fetch(`${API}/usuario/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email: email, Senha: senha })
                });
                const data = await res.json();

                if (!res.ok) {
                    alerta('usuarioAlert', `❌ ${data.error || 'Credenciais inválidas.'}`, 'error');
                    btn.disabled = false;
                    return;
                }

                sessionStorage.setItem('pendingEmail', email);
                sessionStorage.setItem('nomeUsuario', data.usuario.Nome);
                sessionStorage.setItem('usuarioId', data.usuario.Usuario_id);
                sessionStorage.setItem('authToken', 'logged');
                sessionStorage.setItem('tipoUsuario', 'usuario');
                if (data.usuario.FotoPerfil) {
                    sessionStorage.setItem('avatarDataUrl', data.usuario.FotoPerfil);
                } else {
                    sessionStorage.removeItem('avatarDataUrl');
                }

                alerta('usuarioAlert', '✅ Login bem-sucedido! Redirecionando…', 'success');
                setTimeout(() => {
                    window.location.href = 'validacoes.html';
                }, 800);

            } catch (err) {
                alerta('usuarioAlert', '❌ Servidor offline. Verifique se ele está rodando.', 'error');
                btn.disabled = false;
            }
        });

        // ── Login de Admin ────────────────────────────────────────────────
        document.getElementById('adminForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('adminEmail').value.trim();
            const senha = document.getElementById('adminSenha').value;
            const btn   = document.getElementById('btnAdmin');

            btn.disabled = true;
            alerta('adminAlert', '<span class="spin"></span>Autenticando…', 'loading');

            try {
                const res  = await fetch(`${API}/admin/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ Email: email, Senha: senha })
                });
                const data = await res.json();

                if (!res.ok) {
                    alerta('adminAlert', `❌ ${data.error || 'Credenciais inválidas.'}`, 'error');
                    btn.disabled = false;
                    return;
                }

                sessionStorage.setItem('pendingEmail', email);
                sessionStorage.setItem('nomeUsuario', data.usuario.Nome);
                sessionStorage.setItem('usuarioId', data.usuario.Usuario_id);
                sessionStorage.setItem('authToken', 'logged');
                sessionStorage.setItem('tipoUsuario', 'admin');
                if (data.usuario.FotoPerfil) {
                    sessionStorage.setItem('avatarDataUrl', data.usuario.FotoPerfil);
                } else {
                    sessionStorage.removeItem('avatarDataUrl');
                }

                // Admin não precisa de código de verificação — acesso direto
                alerta('adminAlert', '✅ Acesso autorizado! Redirecionando…', 'success');
                setTimeout(() => {
                    window.location.href = '../../index.html';
                }, 800);

            } catch (err) {
                alerta('adminAlert', '❌ Servidor offline.', 'error');
                btn.disabled = false;
            }
        });
    </script>
<script src="../../js/theme.js"></script>
<div style="position:fixed;top:16px;right:16px;z-index:9999">
  <button class="theme-toggle" title="Alternar tema">
    <span class="tt-icon tt-sun">☀️</span>
    <span class="tt-track"><span class="tt-ball"></span></span>
    <span class="tt-icon tt-moon">🌙</span>
  </button>
</div>
</body>
</html>
