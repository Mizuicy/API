<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <link rel="stylesheet" href="../../css/reset.css">
    <script>(function(){var t=localStorage.getItem('kairos-theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validação - Sistema de Devolução</title>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:'Segoe UI',sans-serif;
        }

        body{
            display:flex;
            justify-content:center;
            align-items:center;
            min-height:100vh;
            background: var(--purple-soft);
            color: var(--text);
            transition: background 0.25s, color 0.25s;
        }

        .card{
            background: var(--surface);
            padding:50px;
            border-radius:12px;
            box-shadow:0 10px 40px rgba(0,0,0,0.2);
            width:100%;
            max-width:450px;
            transition: background 0.25s;
        }

        h1{
            text-align:center;
            color: var(--text);
            font-size:1.8rem;
            margin-bottom:8px;
        }

        .subtitulo{
            text-align:center;
            color: var(--muted);
            margin-bottom:30px;
            font-size:0.95rem;
        }

        .info{
            background: var(--purple-soft);
            border-left:4px solid var(--purple);
            padding:12px 15px;
            border-radius:6px;
            margin-bottom:25px;
            font-size:0.9rem;
            color: var(--muted);
            transition: background 0.25s;
        }

        .code-group{
            display:flex;
            justify-content:center;
            gap:8px;
            margin-bottom:25px;
        }

        .code-group input{
            width:45px;
            height:45px;
            text-align:center;
            font-size:1rem;
            font-weight:700;
            border:2px solid var(--border);
            border-radius:6px;
            outline:none;
            background: var(--purple-soft);
            color: var(--text);
            transition:0.2s;
        }

        .code-group input:focus{
            border-color: var(--purple);
        }

        .btn{
            width:100%;
            padding:14px;
            background: var(--purple);
            color:white;
            border:none;
            border-radius:8px;
            font-size:1rem;
            font-weight:600;
            cursor:pointer;
            transition:0.2s;
        }

        .btn:hover:not(:disabled){
            background: var(--purple-mid);
        }

        .btn:disabled{
            background: var(--border);
            color: var(--muted);
            cursor:not-allowed;
        }

        .alert{
            padding:14px;
            border-radius:8px;
            margin-bottom:20px;
            font-size:0.9rem;
        }

        .alert.error{
            background: var(--error-bg, #f8d7da);
            color: var(--error, #721c24);
            border:1px solid var(--error-border, #f5c6cb);
        }

        .alert.success{
            background: var(--success-bg, #d4edda);
            color: var(--success, #155724);
            border:1px solid var(--success-border, #c3e6cb);
        }

        .alert.loading{
            background: var(--surface);
            color: var(--purple);
            border:1px solid var(--border);
        }

        .spin{
            display:inline-block;
            width:14px;
            height:14px;
            border:2px solid currentColor;
            border-top-color:transparent;
            border-radius:50%;
            animation:spin .6s linear infinite;
            margin-right:8px;
        }

        @keyframes spin{
            to{
                transform:rotate(360deg);
            }
        }

        .timer{
            text-align:center;
            color: var(--muted);
            font-size:0.85rem;
            margin-top:15px;
        }

        .timer.aviso{
            color: var(--error, #e74c3c);
            font-weight:600;
        }

        .reenviar,
        .voltar{
            text-align:center;
            margin-top:15px;
        }

        .reenviar a,
        .voltar a{
            color: var(--purple);
            cursor:pointer;
            text-decoration:none;
            font-weight:600;
        }
    </style>
</head>

<body>

<div style="position:fixed;top:16px;right:16px;z-index:9999">
    <button class="theme-toggle" title="Alternar tema">
        <span class="tt-icon tt-sun">☀️</span>
        <span class="tt-track"><span class="tt-ball"></span></span>
        <span class="tt-icon tt-moon">🌙</span>
    </button>
</div>

<div class="card">

    <div style="text-align:center;font-size:3rem;margin-bottom:15px;">
        🔐
    </div>

    <h1>Validação de Conta</h1>

    <p class="subtitulo">
        Confirme seu email para continuar
    </p>

    <div id="alertBox"></div>

    <div class="info">
        <strong>ℹ️</strong>
        Um código foi enviado para
        <strong id="emailExibido">seu email</strong>.
    </div>

    <form id="formCodigo">

        <div class="code-group" id="codeGroup">
            <input type="text" maxlength="1" required>
            <input type="text" maxlength="1" required>
            <input type="text" maxlength="1" required>
            <input type="text" maxlength="1" required>
            <input type="text" maxlength="1" required>
            <input type="text" maxlength="1" required>
        </div>

        <button type="submit" class="btn" id="btnVerificar">
            Validar Conta
        </button>

    </form>

    <div class="timer" id="timer">
        Código expira em:
        <span id="countdown">10:00</span>
    </div>

    <div class="reenviar">
        <a onclick="reenviarCodigo()">
            Não recebeu? Reenviar código
        </a>
    </div>

    <div class="voltar">
        <a href="login.html">
            ← Voltar ao login
        </a>
    </div>

</div>

<script>

const API = 'http://localhost:3000';

const emailAtual =
    sessionStorage.getItem('pendingEmail') || '';

document.getElementById('emailExibido').textContent =
    emailAtual || 'seu email';

let segundos = 600;
let timerInterval;

iniciarTimer();

window.addEventListener('DOMContentLoaded', async () => {

    if(!emailAtual){

        alerta(
            'Nenhum email encontrado. Faça login novamente.',
            'error'
        );

        document.getElementById('btnVerificar').disabled = true;

        setTimeout(() => {
            window.location.href = 'login.html';
        },3000);

        return;
    }

    await enviarCodigo();

});

function iniciarTimer(){

    timerInterval = setInterval(() => {

        segundos--;

        if(segundos <= 0){

            clearInterval(timerInterval);

            document.getElementById('countdown').textContent = '00:00';

            document.getElementById('btnVerificar').disabled = true;

            alerta(
                'Código expirado. Clique em reenviar código.',
                'error'
            );

            return;
        }

        const minutos =
            String(Math.floor(segundos / 60)).padStart(2,'0');

        const secs =
            String(segundos % 60).padStart(2,'0');

        document.getElementById('countdown').textContent =
            `${minutos}:${secs}`;

        if(segundos <= 60){
            document.getElementById('timer')
                .classList.add('aviso');
        }

    },1000);

}

const inputs =
    document.querySelectorAll('#codeGroup input');

inputs.forEach((input,index) => {

    input.addEventListener('input', () => {

        input.value =
            input.value.replace(/\D/g,'');

        if(input.value && index < inputs.length - 1){
            inputs[index + 1].focus();
        }

    });

    input.addEventListener('keydown', (e) => {

        if(
            e.key === 'Backspace' &&
            !input.value &&
            index > 0
        ){
            inputs[index - 1].focus();
        }

    });

});

async function enviarCodigo(){

    try{

        const res = await fetch(
            `${API}/usuario/authcode`,
            {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    Email: emailAtual
                })
            }
        );

        const data = await res.json();

        if(!res.ok){
            throw new Error(
                data.error || 'Erro ao enviar código.'
            );
        }

        console.log('Código enviado.');

    }catch(err){

        alerta(
            `Erro ao enviar código: ${err.message}`,
            'error'
        );

    }

}

document
.getElementById('formCodigo')
.addEventListener('submit', verificarCodigo);

async function verificarCodigo(e){

    e.preventDefault();

    const codigo =
        Array.from(inputs)
        .map(i => i.value)
        .join('');

    if(codigo.length < 6){

        alerta(
            'Digite os 6 números do código.',
            'error'
        );

        return;
    }

    const btn =
        document.getElementById('btnVerificar');

    btn.disabled = true;

    alerta(
        '<span class="spin"></span>Verificando...',
        'loading'
    );

    try{

        const res = await fetch(
            `${API}/usuario/authcode/verify`,
            {
                method:'POST',
                headers:{
                    'Content-Type':'application/json'
                },
                body:JSON.stringify({
                    Email: emailAtual,
                    Codigo: codigo
                })
            }
        );

        const data = await res.json();

        if(!res.ok){
            throw new Error(
                data.error || 'Código inválido.'
            );
        }

        clearInterval(timerInterval);

        alerta(
            '✅ Email validado com sucesso!',
            'success'
        );

        const tipo =
            sessionStorage.getItem('tipoUsuario');

        setTimeout(() => {

            window.scrollTo(0, 0);

            if(tipo === 'admin'){
                window.location.replace(
                    '../../index.html'
                );
            }else{
                window.location.replace(
                    '../biblioteca/inicio.html'
                );
            }

        },1500);

    }catch(err){

        alerta(
            `❌ ${err.message}`,
            'error'
        );

        btn.disabled = false;

    }

}

async function reenviarCodigo(){

    segundos = 600;

    clearInterval(timerInterval);

    iniciarTimer();

    document
        .getElementById('timer')
        .classList.remove('aviso');

    document
        .getElementById('btnVerificar')
        .disabled = false;

    alerta(
        '<span class="spin"></span>Reenviando código...',
        'loading'
    );

    await enviarCodigo();

    alerta(
        '✅ Novo código enviado!',
        'success'
    );

}

function alerta(msg,tipo){

    document.getElementById('alertBox').innerHTML =
        `<div class="alert ${tipo}">${msg}</div>`;

}

</script>
<script src="../../js/theme.js"></script>
</body>
</html>
